[project]
name = "ee2pw"
version = "0.1.0"
authors = [
    {name = "Tamado Sitohang", email = "tamado@tamado.codes"}
]
description = "Convert easyeffects preset to pipewire smart filters"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Sound/Audio",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.scripts]
ee2pw = "ee2pw.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ee2pw", "ee2pw.plugins"]

[dependency-groups]
dev = [
    "ruff>=0.17",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "PIE", "RUF"]
